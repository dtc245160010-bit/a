<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Responsive Grid - SASS</title>

    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <div class="gridcontainer">
      <!-- Header -->
      <div class="gridwrapper header">
        <div class="gridcontent"></div>
      </div>

      <!-- Content -->
      <div class="gridwrapper content">
        <!-- Sidebar -->
        <div class="gridcontent sidebar">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>

        <!-- Main -->
        <div class="gridcontent main"></div>
        <div class="gridcontent main"></div>
        <div class="gridcontent main"></div>
        <div class="gridcontent main"></div>
        <div class="gridcontent main"></div>
        <div class="gridcontent main"></div>

        <!-- Right -->
        <div class="gridcontent right">
          <div class="box"></div>
        </div>
      </div>

      <!-- Footer -->
      <div class="gridwrapper footer">
        <div class="gridcontent"></div>
      </div>
    </div>

    <p>
      Resize the browser window to see that this grid will respond to the
      resizing, and always use 100% of the available space.
    </p>
  </body>
</html>
